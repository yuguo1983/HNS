[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "denny-agent"
version = "1.0.0"
description = "Denny Agent — 单文件 AI 智能体，内置工具 / MCP / Skills / 三层记忆 / Swarm 多Agent协作"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Denny"}]
dependencies = [
    "anthropic>=0.30.0",
    "mcp>=1.0.0",
    "colorama>=0.4.6",
    "pyserial>=3.5",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
image = ["Pillow", "rembg"]
dev = ["pyinstaller"]

[project.scripts]
denny = "agent:cli"

[tool.setuptools]
py-modules = ["agent", "swarm_agent", "webui", "utils", "serial_comm", "serial_gui"]
packages = ["skills"]

[tool.setuptools.package-data]
skills = ["**/*.md", "**/*.py"]
