<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Denny Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f0f0f0; height: 100vh; overflow: hidden; }

  .layout { display: flex; height: 100vh; }

  /* ── Sidebar ── */
  .sidebar {
    width: 220px;
    background: #1a1a2e;
    color: #fff;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar-header {
    padding: 16px 12px 12px;
    border-bottom: 1px solid #333;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sidebar-header h2 { font-size: 0.9em; color: #aaa; font-weight: normal; }
  #new-session-btn {
    width: 28px; height: 28px;
    background: #007aff; color: #fff;
    border: none; border-radius: 6px;
    font-size: 1.1em; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  #new-session-btn:hover { background: #0066dd; }

  .session-list { flex: 1; overflow-y: auto; }
  .session-item {
    padding: 10px 12px;
    cursor: pointer;
    border-bottom: 1px solid #252540;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .session-item:hover { background: #252540; }
  .session-item.active { background: #2d2d5a; border-left: 3px solid #007aff; }
  .session-item .sid { font-size: 0.8em; color: #888; font-family: monospace; }
  .session-item .preview { font-size: 0.75em; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── Main ── */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; background: #fff;
    border-bottom: 1px solid #e0e0e0;
  }
  header h1 { font-size: 1.1em; color: #222; }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .header-btn {
    padding: 6px 12px; border: 1px solid #e0e0e0; border-radius: 6px;
    background: #fff; font-size: 0.8em; cursor: pointer; color: #555;
  }
  .header-btn:hover { background: #f5f5f5; }
  .header-btn.danger { color: #c0392b; border-color: #fab; }
  .header-btn.danger:hover { background: #fee; }

  #status {
    padding: 6px 20px; font-family: "Courier New", monospace; font-size: 0.8em;
    background: #fff; border-bottom: 1px solid #f0f0f0; color: #888;
  }
  #status .phase { font-weight: bold; color: #888; }
  #status .phase.thinking { color: #888; }
  #status .phase.tools { color: #e67e22; }
  #status .phase.done { color: #27ae60; }
  #status .phase.error { color: #c0392b; }

  #messages {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .msg-user { align-self: flex-end; background: #007aff; color: #fff; border-bottom-right-radius: 4px; }
  .msg-assistant { align-self: flex-start; background: #fff; color: #222; border: 1px solid #e0e0e0; border-bottom-left-radius: 4px; }
  .msg-error { align-self: flex-start; background: #fee; color: #c0392b; border: 1px solid #fab; }

  .tool-block { align-self: stretch; background: #fafafa; border: 1px solid #e0e0e0; border-radius: 8px; padding: 10px 14px; font-size: 0.85em; }
  .tool-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .tool-badge { background: #27ae60; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 0.8em; font-weight: bold; }
  .tool-name { font-family: monospace; color: #555; font-weight: bold; }
  .tool-input { background: #f5f5f5; border-radius: 4px; padding: 6px 8px; margin-bottom: 6px; color: #666; font-family: monospace; font-size: 0.9em; white-space: pre-wrap; }
  .tool-result { color: #333; padding: 6px 0 0 0; border-top: 1px solid #eee; margin-top: 6px; white-space: pre-wrap; }
  .tool-result.truncated { color: #999; font-style: italic; }

  #input-area { display: flex; gap: 8px; padding: 12px 20px; background: #fff; border-top: 1px solid #e0e0e0; }
  textarea { flex: 1; padding: 10px 14px; border: 1px solid #e0e0e0; border-radius: 8px; font-family: inherit; font-size: 1em; resize: none; min-height: 56px; max-height: 200px; }
  textarea:focus { outline: none; border-color: #007aff; }
  #send-btn { padding: 10px 20px; background: #007aff; color: #fff; border: none; border-radius: 8px; font-size: 1em; cursor: pointer; font-weight: 500; align-self: flex-end; }
  #send-btn:hover { background: #0066dd; }
  #send-btn:disabled { background: #ccc; cursor: not-allowed; }

  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #999; gap: 8px; }
  .empty-state p { font-size: 0.9em; }
</style>
</head>
<body>
<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>会话列表</h2>
      <button id="new-session-btn" title="新建会话">+</button>
    </div>
    <div class="session-list" id="session-list"></div>
  </div>

  <!-- Main -->
  <div class="main">
    <header>
      <h1>Denny Agent <small id="current-sid" style="font-size:0.6em;color:#999;font-weight:normal"></small></h1>
      <div class="header-actions">
        <button class="header-btn" id="copy-sid-btn" title="复制会话ID">复制ID</button>
        <button class="header-btn" id="clear-btn">清空</button>
        <button class="header-btn danger" id="delete-btn">删除会话</button>
      </div>
    </header>
    <div id="status"><span class="phase">就绪</span></div>
    <div id="messages"></div>
    <div class="empty-state" id="empty-state">
      <p>选择一个会话开始，或点击左上角 <b>+</b> 新建会话</p>
    </div>
    <div id="input-area">
      <textarea id="msg-input" placeholder="输入消息... (Enter 发送，Shift+Enter 换行)" rows="1"></textarea>
      <button id="send-btn">发送</button>
    </div>
  </div>
</div>
<script src="/webui/static/app.js"></script>
</body>
</html>
